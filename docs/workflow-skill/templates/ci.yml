name: CI Pipeline

# 门禁骨架：来源检查 + 契约快照 + summary（Required checks）。
# 业务 job（build/test/lint）按项目栈添加，并在 summary 的 needs 中登记。

on:
  push:
    branches: [master, 'feature/**', 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [master, 'test/**']
  merge_group:

jobs:
  release_source_check:
    name: Release source check
    runs-on: ubuntu-latest
    steps:
      - name: Master only accepts PRs from test/integration
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$BASE" != "master" ]]; then
            echo "非 master 目标 PR，跳过来源检查（base: $BASE）。"
            exit 0
          fi
          if [[ "$HEAD" != "test/integration" ]]; then
            echo "❌ master 只接受来自 test/integration 的版本发布 PR（当前 head: $HEAD）。"
            echo "流程：版本 PR 先合入 test/integration → 三层门禁（L1/L2/L3）通过 → 发布 PR 到 master。"
            exit 1
          fi
          echo "✅ head 为 test/integration，允许发布。"

  # ===== 业务 job 占位 =====
  # 在此添加你的 build/test/lint job（示例：backend / frontend），
  # 完成后把它们加入下方 summary 的 needs 列表，并在 GitHub 设置 Required checks 选中 "Required checks"。
  # 参考实现见 quant-lean 仓库 docs/workflow-skill/templates/ci.yml（全量版）。

  contract_snapshot:
    name: Contract snapshot diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Snapshot diff (if infra exists)
        run: |
          if [ -d tests/snapshots ] || [ -d backend/tests/snapshots ]; then
            echo "快照目录存在——按项目栈运行契约锁测试（由项目 agent 接入）。"
            # 示例：python -m pytest backend/tests/test_contract_lock.py -q --tb=short
            exit 1
          else
            echo "No snapshot infra yet (arrives with first L1 implementation)"
          fi

  summary:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [release_source_check, contract_snapshot]
    if: always()
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          if [[ "${{ needs.release_source_check.result }}" != "success" || "${{ needs.contract_snapshot.result }}" != "success" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required checks passed."
