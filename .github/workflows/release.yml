name: Release Verification

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Release verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify tag version format
        run: |
          echo "TAG=${{ github.ref_name }}"
          if ! echo "${{ github.ref_name }}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid tag format" && exit 1
          fi

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v6

      - name: Install OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: pip install -r requirements.txt "torch==2.5.1"
      - name: Install dependencies
        if: runner.os != 'macOS'
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check backend/ tests/integration/ conftest.py

      - name: Unit tests
        run: python -m pytest backend/tests/ -q --tb=short --timeout=120

      - name: Integration tests
        run: python -m pytest tests/integration/ -q --tb=short --timeout=180

      - name: Contract snapshot diff
        run: |
          if [ -d backend/tests/snapshots ]; then
            python -m pytest backend/tests/test_contract_lock.py -q --tb=short --timeout=300
          else
            echo "No snapshot infra yet (arrives in v0.3.0)"
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run test
      - working-directory: frontend
        run: npm run build

  summary:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.frontend.result }}" != "success" ]]; then
            echo "Release verification failed."
            exit 1
          fi
          echo "Release verification passed. Version evidence: ${{ github.ref_name }}"
