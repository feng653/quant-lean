name: opencode

on:
  issues:
    types: [opened, labeled, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  opencode:
    # 安全门控：只允许仓库拥有者 feng653 触发（公开仓库 + 仓库写权限）。
    # 运行环境：云端 ubuntu（隔离一次性环境，天然多 job 并行）；
    # 代码任务不需要本机 31G 数据（测试用隔离临时库），E2E（L3）仍在本机
    # self-hosted runner（e2e_release.yml），真实数据只在 L3 环节接触。
    if: >-
      github.actor == 'feng653' && (
        (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'agent')) ||
        (github.event_name == 'issue_comment' && (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))) ||
        github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Parallel eligibility guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python .github/scripts/check_parallel.py

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-

      - name: Configure git credentials for agent pushes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "opencode-bot"
          git config --global user.email "opencode-bot@users.noreply.github.com"
          git config --global credential.helper '!f() { echo "username=x-access-token"; echo "password=$GITHUB_TOKEN"; }; f'

      # 硬控制（机器驱动，不依赖 AI 自行 push）：后台循环定时把 agent 所在分支
      # 的工作区改动 commit + push 到云端，让协调者/用户随时可从 GitHub 分支
      # 的提交时间戳判断 agent 是否活跃、进展如何（解决"agent 活跃性外界不可知"）。
      # - 有改动才提交（分析/思考阶段不产生空提交）
      # - commit 消息带 [skip ci]，避免心跳推送触发 CI
      # - agent 步骤结束后由 Stop 步骤（if: always()）杀掉循环
      - name: Start periodic branch upload (hard guard)
        shell: bash
        run: |
          nohup bash -c '
            while true; do
              BRANCH="$(git branch --show-current 2>/dev/null || echo master)"
              if ! git diff --quiet || ! git diff --cached --quiet; then
                git add -A
                git commit -m "heartbeat: auto-upload work in progress [skip ci]" >/dev/null 2>&1 || true
                git push -u origin "HEAD:$BRANCH" >/dev/null 2>&1 || true
              fi
              sleep 120
            done
          ' > /tmp/heartbeat-pusher.log 2>&1 &
          echo $! > /tmp/heartbeat-pusher.pid
          sleep 1
          if kill -0 "$(cat /tmp/heartbeat-pusher.pid)" 2>/dev/null; then
            echo "heartbeat pusher started (pid $(cat /tmp/heartbeat-pusher.pid))"
          else
            echo "❌ heartbeat pusher failed to start: $(cat /tmp/heartbeat-pusher.log)"
            exit 1
          fi

      - name: Run OpenCode agent
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 专用配置：一次性 runner 全权限（含 rm -rf），避免非交互模式权限询问挂死。
          # 本地交互模式仍使用仓库根 opencode.json（保留安全网）。
          OPENCODE_CONFIG: ${{ github.workspace }}/.github/opencode-ci.json
        with:
          use_github_token: true
          model: ${{ vars.AGENT_MODEL || 'deepseek/deepseek-v4-flash' }}
          agent: req-executor
          # 契约快照守则：行为不变任务禁止改 backend/tests/snapshots/；
          # 行为变化任务必须显式更新并在 PR 列出变更清单，等用户 Approve。
          prompt: |
            你是本仓库的"需求执行者"。请完整遵守根目录 AGENTS.md 和 docs/PROJECT_PHILOSOPHY.md、
            docs/WORKFLOW_AUTOMATION.md、docs/VERSIONING.md 的规则。
            对当前 issue/评论中的需求：
            1. 先读 docs/todo/TODO_INDEX.md 确认版本状态，只做当前版本方向内的改动。
            2. 分析代码，提出实现方案（改哪些文件、是否行为变化）。
            3. 在独立分支实现并验证：
               - 先安装依赖：`pip install -r requirements.txt`（云端 runner 无预装环境；
                 若需要 `uv` 等工具可自行安装）。
               - 代码改动：先跑**相关测试子集 + ruff** 快速验证（如
                 `pytest backend/tests/test_xxx.py -q`），确认改动正确即可；
                 **全量 pytest/前端 build 由 CI 分层承担**（dev 层 fast 检查 + 汇聚层全量），
                 不必在 agent 侧跑全量（快 10 倍）。
               - 纯文档/配置改动（docs/**、*.md、*.json 等）：只需 ruff + 冒烟（import 后端）即可。
            4. 开 PR：描述里写清改动、测试结果、快照状态（零 diff 或显式变更清单）。
               默认 base 分支为 **dev**（开发汇聚层，fast 检查后自动合并）；禁止直接 base
               master（master 只收来自 test/integration 的发布 PR）。开 PR 命令必须显式
               指定 --base dev：`gh pr create --base dev --head <分支> ...`。
               **PR 描述末尾必须写 `Closes #<issue_number>`**（GitHub 合并时自动关闭
               对应 issue；任务完成以 issue 关闭为准，PR 合入 test/integration 后自动关）。
            5. 若开 PR 被 GitHub 拒绝（403 not permitted）：把代码 commit + push 到分支，
               在 issue 评论写明"分支名: <branch>"，结束。
            行为不变的任务不得改动 backend/tests/snapshots/ 任何文件。

      - name: Stop periodic branch upload
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/heartbeat-pusher.pid ]; then
            kill "$(cat /tmp/heartbeat-pusher.pid)" 2>/dev/null || true
            rm -f /tmp/heartbeat-pusher.pid
            echo "heartbeat pusher stopped"
          else
            echo "no heartbeat pusher to stop"
          fi
