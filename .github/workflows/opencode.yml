name: opencode

on:
  issues:
    types: [opened, labeled, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  opencode:
    if: >-
      contains(github.event.issue.labels.*.name, 'agent') ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Parallel eligibility guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python .github/scripts/check_parallel.py

      - name: Run OpenCode agent
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 专用配置：一次性 runner 全权限（含 rm -rf），避免非交互模式权限询问挂死。
          # 本地交互模式仍使用仓库根 opencode.json（保留安全网）。
          OPENCODE_CONFIG: ${{ github.workspace }}/.github/opencode-ci.json
        with:
          use_github_token: true
          model: ${{ vars.AGENT_MODEL || 'deepseek/deepseek-v4-flash' }}
          agent: req-executor
          # 契约快照守则：行为不变任务禁止改 backend/tests/snapshots/；
          # 行为变化任务必须显式更新并在 PR 列出变更清单，等用户 Approve。
          prompt: |
            你是本仓库的"需求执行者"。请完整遵守根目录 AGENTS.md 和 docs/PROJECT_PHILOSOPHY.md、
            docs/WORKFLOW_AUTOMATION.md、docs/VERSIONING.md 的规则。
            对当前 issue/评论中的需求：
            1. 先读 docs/todo/TODO_INDEX.md 确认版本状态，只做当前版本方向内的改动。
            2. 分析代码，提出实现方案（改哪些文件、是否行为变化）。
            3. 在独立分支实现，跑完整验证（ruff、pytest backend/tests、pytest tests/integration、前端 build）。
            4. 开 PR：描述里写清改动、测试结果、快照状态（零 diff 或显式变更清单）。
            行为不变的任务不得改动 backend/tests/snapshots/ 任何文件。
