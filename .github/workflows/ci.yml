name: CI Pipeline

on:
  push:
    branches: [master, 'feature/**', 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: python -c "import platform; machine = platform.machine(); print(machine); assert machine == 'arm64'"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: pip install -r requirements.txt "torch==2.5.1"
      - name: Install dependencies
        if: runner.os != 'macOS'
        run: pip install -r requirements.txt
      - name: Audit Python runtime dependencies
        if: runner.os == 'Linux'
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
      - run: ruff check backend/ tests/integration/ conftest.py
      - run: python -m pytest backend/tests/ -q --tb=short --timeout=120
      - run: python -m pytest tests/integration/ -q --tb=short --timeout=180
      - name: API contract alignment
        if: runner.os == 'Linux'
        run: python -m pytest tests/test_api_alignment.py -q --tb=short

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm audit --omit=dev
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run test
      - working-directory: frontend
        run: npm run build

  summary:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.frontend.result }}" != "success" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required checks passed."
