name: CI Pipeline

on:
  push:
    branches: [master, 'feature/**', 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [master, 'test/**']
  merge_group:

jobs:
  release_source_check:
    name: Release source check
    runs-on: ubuntu-latest
    steps:
      - name: Master only accepts PRs from test/integration
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$BASE" != "master" ]]; then
            echo "非 master 目标 PR，跳过来源检查（base: $BASE）。"
            exit 0
          fi
          if [[ "$HEAD" != "test/integration" ]]; then
            echo "❌ master 只接受来自 test/integration 的版本发布 PR（当前 head: $HEAD）。"
            echo "流程：版本 PR 先合入 test/integration → 真实数据 E2E 通过 → 发布 PR 到 master。"
            exit 1
          fi
          echo "✅ head 为 test/integration，允许发布。"

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' && github.ref == 'refs/heads/master') && '["ubuntu-latest", "macos-15"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: python -c "import platform; machine = platform.machine(); print(machine); assert machine == 'arm64'"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: pip install -r requirements.txt "torch==2.5.1"
      - name: Install dependencies
        if: runner.os != 'macOS'
        run: pip install -r requirements.txt
      - name: Audit Python runtime dependencies
        if: runner.os == 'Linux'
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
      - run: ruff check backend/ tests/integration/ conftest.py
      - run: python -m pytest backend/tests/ -q --tb=short --timeout=120
      - run: python -m pytest tests/integration/ -q --tb=short --timeout=180
      - name: API contract alignment
        if: runner.os == 'Linux'
        run: python -m pytest tests/test_api_alignment.py -q --tb=short

  health_check:
    name: L2 health check (synthetic E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: L2 automatic health check (register → experiment → backtest → paper)
        run: python -m pytest tests/integration/test_e2e_availability.py -q --tb=short --timeout=300

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm audit --omit=dev
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run test
      - working-directory: frontend
        run: npm run build

  snapshot_baseline_diff:
    name: Snapshot baseline diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Baseline diff against base branch
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if [[ -z "$BASE_REF" ]]; then
            echo "非 PR 事件（push），跳过基线比对。"
            exit 0
          fi
          git fetch origin "$BASE_REF" --depth=1
          diff_files=$(git diff --name-only "origin/$BASE_REF...HEAD" -- backend/tests/snapshots/)
          if [[ -z "$diff_files" ]]; then
            echo "✅ 快照与基线零改动。"
            exit 0
          fi
          if [[ "$PR_LABELS" == *"behavior-change"* ]]; then
            echo "✅ 快照有改动，但 PR 已声明 behavior-change（还需 codeowner 审批）。"
            exit 0
          fi
          echo "❌ 未声明行为变化但快照被改动（静默改快照 = 掩盖行为变化）："
          echo "$diff_files"
          echo "行为变化必须：1) PR 加 behavior-change 标签 2) PR 描述列变更清单 3) 等用户 Approve。"
          exit 1

  summary:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [release_source_check, backend, health_check, frontend, contract_snapshot, snapshot_baseline_diff]
    if: always()
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          if [[ "${{ needs.release_source_check.result }}" != "success" || "${{ needs.backend.result }}" != "success" || "${{ needs.health_check.result }}" != "success" || "${{ needs.frontend.result }}" != "success" || "${{ needs.contract_snapshot.result }}" != "success" || "${{ needs.snapshot_baseline_diff.result }}" != "success" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required checks passed."

  contract_snapshot:
    name: Contract snapshot diff
    runs-on: ubuntu-latest
    needs: [backend]
    if: always()
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Snapshot diff (if infra exists)
        run: |
          if [ -d backend/tests/snapshots ] && [ -f backend/tests/test_contract_lock.py ]; then
            python -m pytest backend/tests/test_contract_lock.py -q --tb=short --timeout=300
          else
            echo "No snapshot infra yet (arrives in v0.3.0)"
          fi
