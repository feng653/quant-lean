name: CI Pipeline

# CI 豁免矩阵（纯文档/静态资源/配置类改动不触发 CI）：
# - docs/**、*.md、docs/assets/**（图片）→ 完全豁免
# - deploy/macos/*.plist、frontend/README.md → 完全豁免（部署配置/前端文档）
# - data/tuning/*.json → 完全豁免（调参记录，非代码）
# - .opencode/agents/*.md → 完全豁免（agent 提示词）
# - .github/workflows/*  → 强制 full（工作流改坏会绕过门禁，不可豁免）
# - backend/tests/snapshots/ → full + 人工（行为变化红线）
on:
  push:
    branches: [master, dev, 'feature/**', 'feat/**', 'fix/**', 'refactor/**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'deploy/macos/*.plist'
      - 'data/tuning/*.json'
      - '.opencode/agents/*.md'
  pull_request:
    branches: [master, dev, 'test/**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'deploy/macos/*.plist'
      - 'data/tuning/*.json'
      - '.opencode/agents/*.md'
  merge_group:

jobs:
  # ── 分层判定：全量测试只跑在汇聚层（test/integration / master），
  #    dev 层与普通分支只跑快速检查（fast_checks）。
  tier:
    name: Tier (full vs fast)
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.tier.outputs.full }}
      skip: ${{ steps.tier.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tier
        shell: bash
        run: |
          base="${{ github.base_ref }}"
          ref="${{ github.ref }}"
          full="false"
          skip="false"
          # 汇聚层/发布层：全量
          if [[ "$base" == "test/integration" || "$base" == "master" || "$ref" == "refs/heads/test/integration" || "$ref" == "refs/heads/master" ]]; then
            full="true"
          fi
          # 工作流/CI 配置改动：强制全量（工作流改坏会绕过门禁，不能走 fast 层）
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # 用 base.sha 做三点 diff（覆盖多 commit PR；无需 fetch origin/$base）
            changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD 2>/dev/null || true)"
            if echo "$changed" | grep -qE '^\.github/workflows/'; then
              echo "检测到工作流配置改动，强制 full tier"
              full="true"
            fi
            # 纯文档豁免：若改动全是豁免路径，跳过 CI 主体（docs/md/plist/tuning/agent md）
            non_ignored="$(echo "$changed" | grep -vE '^(docs/|.*\.md$|deploy/macos/.*\.plist$|data/tuning/.*\.json$|\.opencode/agents/.*\.md$)' | grep -v '^$' || true)"
            if [[ -z "$non_ignored" ]]; then
              echo "改动仅含豁免路径（文档/配置），跳过 CI 主体"
              skip="true"
            fi
          else
            # push 事件：改动含 .github/workflows 也强制全量（auto_merge 合并产生的 commit 与 HEAD~1 对比）
            changed="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
            if echo "$changed" | grep -qE '^\.github/workflows/'; then
              echo "检测到工作流配置改动，强制 full tier"
              full="true"
            fi
            non_ignored="$(echo "$changed" | grep -vE '^(docs/|.*\.md$|deploy/macos/.*\.plist$|data/tuning/.*\.json$|\.opencode/agents/.*\.md$)' | grep -v '^$' || true)"
            if [[ -z "$non_ignored" ]]; then
              echo "改动仅含豁免路径（文档/配置），跳过 CI 主体"
              skip="true"
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  release_source_check:
    name: Release source check
    runs-on: ubuntu-latest
    steps:
      - name: Master only accepts PRs from test/integration
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$BASE" != "master" ]]; then
            echo "非 master 目标 PR，跳过来源检查（base: $BASE）。"
            exit 0
          fi
          if [[ "$HEAD" != "test/integration" ]]; then
            echo "❌ master 只接受来自 test/integration 的版本发布 PR（当前 head: $HEAD）。"
            echo "流程：版本 PR 先合入 test/integration → 真实数据 E2E 通过 → 发布 PR 到 master。"
            exit 1
          fi
          echo "✅ head 为 test/integration，允许发布。"

  test_source_check:
    name: Test source check (dev only)
    runs-on: ubuntu-latest
    steps:
      - name: test/integration only accepts batch PRs from dev
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$BASE" != "test/integration" ]]; then
            echo "非 test/integration 目标 PR，跳过来源检查（base: $BASE）。"
            exit 0
          fi
          if [[ "$HEAD" != "dev" ]]; then
            echo "❌ test/integration 只接受来自 dev 的批 PR（当前 head: $HEAD）。"
            echo "流程：任务 PR 先合入 dev（fast 检查）→ dev 攒批 → 批 PR dev → test/integration（全量）。"
            exit 1
          fi
          echo "✅ head 为 dev，允许汇聚。"

  fast_checks:
    name: Fast checks (ruff + smoke)
    if: needs.tier.outputs.skip != 'true'
    needs: [tier]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - run: ruff check backend/ tests/integration/ conftest.py
      - name: Python import smoke (backend boots)
        run: |
          python -c "from backend.main import app; print('app imports OK')"
      - name: Fast unit subset (core + jobs broker)
        run: python -m pytest backend/tests/test_core.py backend/tests/test_core_hashing.py backend/tests/test_core_timeutils.py backend/tests/test_jwt_security.py -q --tb=short --timeout=120

  backend:
    name: Backend (${{ matrix.os }})
    if: needs.tier.outputs.full == 'true' && needs.tier.outputs.skip != 'true'
    needs: [tier]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' && github.ref == 'refs/heads/master') && '["ubuntu-latest", "macos-15"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: python -c "import platform; machine = platform.machine(); print(machine); assert machine == 'arm64'"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: pip install -r requirements.txt "torch==2.5.1"
      - name: Install dependencies
        if: runner.os != 'macOS'
        run: pip install -r requirements.txt
      - name: Audit Python runtime dependencies
        if: runner.os == 'Linux'
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
      - run: ruff check backend/ tests/integration/ conftest.py
      - run: python -m pytest backend/tests/ -q --tb=short --timeout=120
      - run: python -m pytest tests/integration/ -q --tb=short --timeout=180
      - name: API contract alignment
        if: runner.os == 'Linux'
        run: python -m pytest tests/test_api_alignment.py -q --tb=short

  health_check:
    name: L2 health check (synthetic E2E)
    if: needs.tier.outputs.full == 'true' && needs.tier.outputs.skip != 'true'
    needs: [tier]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: L2 automatic health check (register → experiment → backtest → paper)
        run: python -m pytest tests/integration/test_e2e_availability.py -q --tb=short --timeout=300

  frontend:
    name: Frontend
    if: needs.tier.outputs.skip != 'true'
    needs: [tier]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm audit --omit=dev
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run test
      - working-directory: frontend
        run: npm run build

  snapshot_baseline_diff:
    name: Snapshot baseline diff
    if: needs.tier.outputs.skip != 'true'
    needs: [tier]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Baseline diff against base branch
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if [[ -z "$BASE_REF" ]]; then
            echo "非 PR 事件（push），跳过基线比对。"
            exit 0
          fi
          git fetch origin "$BASE_REF" --depth=1
          diff_files=$(git diff --name-only "origin/$BASE_REF...HEAD" -- backend/tests/snapshots/)
          if [[ -z "$diff_files" ]]; then
            echo "✅ 快照与基线零改动。"
            exit 0
          fi
          if [[ "$PR_LABELS" == *"behavior-change"* ]]; then
            echo "✅ 快照有改动，但 PR 已声明 behavior-change（还需 codeowner 审批）。"
            exit 0
          fi
          echo "❌ 未声明行为变化但快照被改动（静默改快照 = 掩盖行为变化）："
          echo "$diff_files"
          echo "行为变化必须：1) PR 加 behavior-change 标签 2) PR 描述列变更清单 3) 等用户 Approve。"
          exit 1

  summary:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [release_source_check, test_source_check, fast_checks, backend, health_check, frontend, contract_snapshot, snapshot_baseline_diff, tier]
    if: always()
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          SKIP="${{ needs.tier.outputs.skip }}"
          FULL="${{ needs.tier.outputs.full }}"
          # 纯文档/豁免路径改动：CI 主体跳过，直接通过
          if [[ "$SKIP" == "true" ]]; then
            echo "纯文档/配置改动，CI 豁免（skip=true），通过。"
            exit 0
          fi
          # fast 层：release_source_check + test_source_check + fast_checks + frontend + snapshot_baseline_diff 必绿
          if [[ "${{ needs.release_source_check.result }}" != "success" || "${{ needs.test_source_check.result }}" != "success" || "${{ needs.fast_checks.result }}" != "success" || "${{ needs.frontend.result }}" != "success" || "${{ needs.snapshot_baseline_diff.result }}" != "success" ]]; then
            echo "One or more fast-tier required jobs failed."
            exit 1
          fi
          # full 层：backend + health_check + contract_snapshot 也必须绿
          if [[ "$FULL" == "true" ]]; then
            if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.health_check.result }}" != "success" || "${{ needs.contract_snapshot.result }}" != "success" ]]; then
              echo "One or more full-tier required jobs failed."
              exit 1
            fi
          else
            echo "fast 层通过（全量测试在汇聚层 test/integration 执行）"
          fi
          echo "All required checks passed."

  contract_snapshot:
    name: Contract snapshot diff
    runs-on: ubuntu-latest
    needs: [tier, backend]
    if: always() && needs.tier.outputs.full == 'true' && needs.tier.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Snapshot diff (if infra exists)
        run: |
          if [ -d backend/tests/snapshots ] && [ -f backend/tests/test_contract_lock.py ]; then
            python -m pytest backend/tests/test_contract_lock.py -q --tb=short --timeout=300
          else
            echo "No snapshot infra yet (arrives in v0.3.0)"
          fi
