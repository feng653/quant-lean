name: Auto merge to dev / test/integration

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, ready_for_review]
    branches: [dev, test/integration]
  workflow_run:
    workflows: ['CI Pipeline']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto merge (checks green, no snapshot, no behavior-change)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect mergeable PRs
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR 事件，只检查当前 PR #${{ github.event.pull_request.number }}"
            echo "pr_numbers=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "CI 完成事件，扫描所有 open PR → dev / test/integration"
            open_prs="$(gh pr list --base dev --state open --json number -q '.[].number' 2>/dev/null || true; gh pr list --base test/integration --state open --json number -q '.[].number' 2>/dev/null || true)"
            echo "pr_numbers=$(echo $open_prs | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-merge qualifying PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 0) dev 领先阈值检查：dev 领先 test/integration ≥ 8 提交时，不再自动合并新 PR 到 dev
          #    （强制等待 batch_promote.yml 创建批 PR，避免无限积压在 fast 层）
          git fetch origin test/integration --depth=200 2>/dev/null || true
          dev_lead="$(git rev-list --count origin/test/integration..origin/dev 2>/dev/null || echo 0)"
          echo "dev 领先 test/integration: $dev_lead 提交"
          for pr in ${{ steps.prs.outputs.pr_numbers }}; do
            echo "=== 检查 PR #$pr ==="
            base="$(gh pr view "$pr" --json baseRefName -q .baseRefName 2>/dev/null || echo unknown)"
            echo "  base: $base"
            # 0.5) dev 积压闸门：dev 层 PR 且 dev 领先超阈值 → 跳过，等批 PR
            if [[ "$base" == "dev" && "$dev_lead" -ge 8 ]]; then
              echo "  ⏸ dev 已领先 test/integration ≥ 8 提交，暂停合入 dev（等待批 PR 全量验证）"
              gh pr comment "$pr" --body "⏸ dev 积压闸门：dev 已领先 test/integration ≥ 8 提交，自动合入 dev 暂停。等待 batch_promote 创建批 PR（dev → test/integration 全量验证）后再合并。" 2>/dev/null || true
              continue
            fi
            # 1) 快照目录改动 → 必须人工 Approve（行为变化红线），自动合并跳过
            snapshot_files="$(gh pr diff "$pr" --name-only 2>/dev/null | grep -c '^backend/tests/snapshots/' || true)"
            if [[ "$snapshot_files" != "0" ]]; then
              echo "  ⏸ 涉及契约快照（行为变化），需人工 Approve，跳过自动合并"
              gh pr comment "$pr" --body "⏸ 自动合并跳过：涉及契约快照目录，按宪法需用户（行为变化最终确认人）Approve。" 2>/dev/null || true
              continue
            fi
            # 2) 行为变化兜底：改了端点/数据结构文件但未带 behavior-change 标签 → 跳过等人工
            behavior_files="$(gh pr diff "$pr" --name-only 2>/dev/null | grep -cE '^(backend/api/|backend/data/|backend/main.py)' || true)"
            has_label="$(gh pr view "$pr" --json labels -q '[.labels[].name] | index("behavior-change")' 2>/dev/null || echo null)"
            if [[ "$behavior_files" != "0" && "$has_label" == "null" ]]; then
              echo "  ⏸ 触碰 API/数据结构但未声明 behavior-change 标签，跳过自动合并"
              gh pr comment "$pr" --body "⏸ 自动合并跳过：改动涉及端点/数据结构但未带 \`behavior-change\` 标签。若属行为变化请补标签（需用户 Approve）；若确属无行为变化请说明。" 2>/dev/null || true
              continue
            fi
            # 3) CI 状态：分层判定 + 豁免识别
            #    纯文档 PR（skip=true）：Required checks 会通过（summary 直接放行），可直接合并
            #    dev 层 PR：只需 Fast checks + Frontend + Snapshot baseline 绿
            #    test/integration 目标 PR：所有 check 必须 SUCCESS 且无 pending
            #    注意：dev 层 full 级 job（Backend/L2/Contract）会被 tier 跳过（SKIPPED），
            #    必须排除 SKIPPED，否则全部判定会误判 red → dev PR 永不自动合并。
            state="$(gh pr view "$pr" --json statusCheckRollup -q '
              .statusCheckRollup as $c |
              if ($c | length) == 0 then "no_checks"
              else
                (($c | map(select(.conclusion == null)) | length) > 0) as $any_pending |
                if $any_pending then "pending"
                elif (($c | map(select(.conclusion != null and .conclusion != "SKIPPED")) | map(.conclusion == "SUCCESS")) | all) then "green"
                else "red" end
              end' 2>/dev/null || echo unknown)"
            echo "  CI 状态: $state"
            # 3.5) 豁免识别：改动全为豁免路径（docs/md/plist/tuning/agent md）→ Required checks 会绿，直接视为通过
            changed_files="$(gh pr diff "$pr" --name-only 2>/dev/null || true)"
            non_ignored="$(echo "$changed_files" | grep -vE '^(docs/|.*\.md$|deploy/macos/.*\.plist$|data/tuning/.*\.json$|\.opencode/agents/.*\.md$)' | grep -v '^$' || true)"
            if [[ -z "$non_ignored" && -n "$changed_files" ]]; then
              echo "  ✅ 纯文档/配置改动（豁免路径），CI 豁免，直接合并"
              mergeable="$(gh pr view "$pr" --json mergeable -q .mergeable 2>/dev/null || echo UNKNOWN)"
              if [[ "$mergeable" != "CONFLICTING" ]]; then
                gh pr merge "$pr" --merge --auto 2>/dev/null || gh pr merge "$pr" --merge 2>/dev/null \
                  || echo "  ⚠️ 合并失败（可能是 ruleset 条件未满足）"
              else
                echo "  ⏸ 有冲突，跳过"
              fi
              continue
            fi
            if [[ "$base" == "test/integration" ]]; then
              # 汇聚层：必须全绿（含 Backend 全量 + L2 + 快照）
              if [[ "$state" != "green" ]]; then
                echo "  ⏸ test/integration 目标需全量 CI 全绿（$state），跳过"
                continue
              fi
            else
              # dev 层：只需 fast 层关键 check 绿（Fast checks / Frontend / Snapshot baseline）
              # 全量 check（Backend/L2/Contract）在 dev 层不运行（skipped），不阻塞 dev 合并
              fast_state="$(gh pr view "$pr" --json statusCheckRollup -q '
                .statusCheckRollup as $c |
                ($c | map(select(.name == "Fast checks (ruff + smoke)" or .name == "Frontend" or .name == "Snapshot baseline diff"))) as $target |
                if ($target | length) == 0 then "no_checks"
                elif (($target | map(.conclusion == null)) | any) then "pending"
                elif (($target | map(select(.conclusion != null and .conclusion != "SKIPPED")) | map(.conclusion == "SUCCESS")) | all) then "green"
                else "not_green" end' 2>/dev/null || echo unknown)"
              echo "  dev 层 fast checks 状态: $fast_state"
              if [[ "$fast_state" != "green" ]]; then
                echo "  ⏸ dev 层 fast checks 未全绿，跳过"
                continue
              fi
            fi
            # 4) 无 conflict + 可合并
            mergeable="$(gh pr view "$pr" --json mergeable -q .mergeable 2>/dev/null || echo UNKNOWN)"
            if [[ "$mergeable" == "CONFLICTING" ]]; then
              echo "  ⏸ 有冲突，跳过（agent 需 rebase）"
              continue
            fi
            # 5) 自动合并
            echo "  ✅ 自动合并 PR #$pr (base=$base)"
            gh pr merge "$pr" --merge --auto 2>/dev/null || gh pr merge "$pr" --merge 2>/dev/null \
              || echo "  ⚠️ 合并失败（可能是 ruleset 条件未满足）"
            # 6) 关闭关联 issue（仅 test/integration 层：全量验证通过后任务才算完成）
            #    PR 描述含 `Closes #n` 时 GitHub 原生自动关；这里兜底处理 closesIssues
            #    元数据（含 dev 层合并后被解析出来的），确保 dev→test 批 PR 后 issue 关闭。
            if [[ "$base" == "test/integration" ]]; then
              linked="$(gh pr view "$pr" --json closesIssues -q '.closesIssues[].number' 2>/dev/null || true)"
              if [[ -n "$linked" ]]; then
                for num in $linked; do
                  state="$(gh issue view "$num" --json state -q .state 2>/dev/null || echo '')"
                  if [[ "$state" == "OPEN" ]]; then
                    gh issue close "$num" --comment "✅ 已随 PR #$pr 合入 test/integration（全量验证通过），issue 自动关闭。" 2>/dev/null \
                      && echo "  🔒 已关闭 issue #$num" || echo "  ⚠️ 关闭 issue #$num 失败"
                  fi
                done
              fi
            fi
          done
