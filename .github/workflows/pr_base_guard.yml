name: PR base guard

# 硬控制：防止 agent/人工把任务 PR 开到错误的目标分支。
# 规则（汇聚方向唯一）：
#   任务 PR → dev（开发汇聚层）→ 批 PR（head=dev）→ test/integration → 发布 PR → master
# 1) base=master 且 head 不是 test/integration → 自动纠正为 dev
# 2) base=test/integration 且 head 不是 dev → 自动纠正为 dev（test 只接受 dev 批 PR）
# 保留原 PR 标题/描述，关闭后重开 + 留言说明。
# 注意：本 guard 是兜底防线；agent 的正确行为已由 opencode.yml prompt 强制
# `--base dev`（该 prompt 必须随默认分支 master 发布后才会对 issue 触发生效）。

on:
  pull_request:
    types: [opened, reopened, ready_for_review, retargeted]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  guard:
    name: Guard PR base (master/test -> dev)
    runs-on: ubuntu-latest
    steps:
      - name: Check and fix PR base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr="${{ github.event.pull_request.number }}"
          base="${{ github.event.pull_request.base.ref }}"
          head="${{ github.event.pull_request.head.ref }}"
          echo "PR #$pr: base=$base head=$head"
          # 合法目标：dev 汇聚层直接放行
          if [[ "$base" == "dev" ]]; then
            echo "✅ base=dev，任务 PR 汇聚层，正常"
            exit 0
          fi
          # 发布 PR（head=test/integration → master）放行
          if [[ "$base" == "master" && "$head" == "test/integration" ]]; then
            echo "✅ 发布 PR（test/integration → master），放行"
            exit 0
          fi
          # 批 PR（head=dev → test/integration）放行：test 只接受 dev 汇聚的批 PR
          if [[ "$base" == "test/integration" && "$head" == "dev" ]]; then
            echo "✅ 批 PR（dev → test/integration），放行"
            exit 0
          fi
          # 其余：base=master 或 base=test/integration 的任务 PR → 自动纠正为 dev
          echo "❌ 任务 PR 直接 base $base，自动纠正为 dev"
          old_title="$(gh pr view "$pr" --json title -q .title 2>/dev/null || echo "任务 PR")"
          old_body="$(gh pr view "$pr" --json body -q .body 2>/dev/null || true)"
          gh pr comment "$pr" --body "⛔ **PR base 守卫**：任务 PR 只能 base \`dev\`（汇聚方向：dev → test/integration → master）。已自动关闭并重开为 base \`dev\`。" 2>/dev/null || true
          gh pr close "$pr" --comment "自动关闭：base 应为 dev。" 2>/dev/null || true
          new_pr="$(gh pr create --base dev --head "$head" --title "$old_title (rebase to dev)" --body "由 PR base 守卫自动重开：原 PR #$pr base 错误（$base）。\n\n---\n原 PR 描述：\n$old_body" 2>&1 | tail -1)"
          echo "重开 PR: $new_pr"
          if [[ "$new_pr" =~ github.com/ ]]; then
            gh pr comment "$pr" --body "已重开为 dev 目标 PR：$new_pr" 2>/dev/null || true
          fi
          exit 0
